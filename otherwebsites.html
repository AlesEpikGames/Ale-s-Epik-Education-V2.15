    <script>
        const menuFaceImage = 'https://bluemoji.io/cdn-proxy/646218c67da47160c64a84d5/66b3eb19130054e7a5afae28_24.png';
        const menuFaceSize = 88;
        const menuFaceStates = [];

        for (let index = 0; index < 12; index++) {
            const face = document.createElement('img');
            face.className = 'menu-face';
            face.src = menuFaceImage;
            face.alt = '';
            const state = {
                element: face,
                x: Math.random() * Math.max(1, window.innerWidth - menuFaceSize),
                y: Math.random() * Math.max(1, window.innerHeight - menuFaceSize),
                vx: (Math.random() - 0.5) * 2.5,
                vy: (Math.random() - 0.5) * 2.5
            };
            menuFaceStates.push(state);
            face.addEventListener('click', () => {
                state.vx = (Math.random() - 0.5) * 12;
                state.vy = -7 - Math.random() * 5;
            });
            document.body.appendChild(face);
        }

        for (let index = 0; index < 55; index++) {
            const particle = document.createElement('span');
            particle.className = 'menu-particle';
            particle.style.left = `${Math.random() * 100}vw`;
            particle.style.top = `${Math.random() * 100}vh`;
            particle.style.setProperty('--duration', `${6 + (index % 5) * 1.2}s`);
            particle.style.setProperty('--delay', `${-(Math.random() * 6)}s`);
            document.body.appendChild(particle);
        }

        function moveMenuFaces() {
            menuFaceStates.forEach(state => {
                state.x += state.vx;
                state.y += state.vy;
                state.vy += 0.08;

                if (state.x <= 0 || state.x >= window.innerWidth - menuFaceSize) {
                    state.x = Math.max(0, Math.min(state.x, window.innerWidth - menuFaceSize));
                    state.vx *= -1;
                }
                if (state.y <= 0 || state.y >= window.innerHeight - menuFaceSize) {
                    state.y = Math.max(0, Math.min(state.y, window.innerHeight - menuFaceSize));
                    state.vy *= -0.9;
                }

                state.element.style.left = `${state.x}px`;
                state.element.style.top = `${state.y}px`;
            });

            requestAnimationFrame(moveMenuFaces);
        }

        moveMenuFaces();

        const currentDate = new Date();
        const dateElement = document.querySelector('.current-date');
        const dateFormatter = new Intl.DateTimeFormat('en-US', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        });

        dateElement.textContent = dateFormatter.format(currentDate);
        dateElement.dateTime = [
            currentDate.getFullYear(),
            String(currentDate.getMonth() + 1).padStart(2, '0'),
            String(currentDate.getDate()).padStart(2, '0')
        ].join('-');

        const searchInput = document.querySelector('#game-search');
        const sortButton = document.querySelector('#sort-games');
        const gameList = document.querySelector('#game-list');
        const gameButtons = document.querySelectorAll('.game-button');
        const noGamesMessage = document.querySelector('#no-games');
        const regularOrder = [...gameButtons];
        let isSorted = false;

        function filterGames() {
            const searchText = searchInput.value.trim().toLowerCase();
            let visibleGames = 0;

            gameButtons.forEach(gameButton => {
                const title = gameButton.dataset.gameTitle.toLowerCase();
                const isVisible = !searchText || title.startsWith(searchText);

                gameButton.hidden = !isVisible;
                gameButton.style.display = isVisible ? 'flex' : 'none';
                if (isVisible) visibleGames++;
            });

            noGamesMessage.hidden = visibleGames > 0;
        }

        searchInput.addEventListener('input', filterGames);
        sortButton.addEventListener('click', () => {
            if (isSorted) {
                regularOrder.forEach(gameButton => gameList.appendChild(gameButton));
            } else {
                [...gameButtons]
                    .sort((firstGame, secondGame) => firstGame.dataset.gameTitle.localeCompare(secondGame.dataset.gameTitle))
                    .forEach(gameButton => gameList.appendChild(gameButton));
            }

            isSorted = !isSorted;
        });
    </script>
