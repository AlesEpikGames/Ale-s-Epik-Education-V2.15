<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1798507498000756"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/search.css">
    <title>Search</title>
</head>
<body>
    <p class="search-notice">For now, this search runs on iframes, so only put in URLs. Some links won't work, but I will try to make it better.</p>
    <main class="search-page">
        <h1>Search</h1>
        <form class="search-form" id="search-form">
            <label for="search-input">Search the web or enter a URL</label>
            <div class="search-controls">
                <input id="search-input" type="search" placeholder="Search or enter a URL..." autocomplete="off" required>
                <button type="submit">Go</button>
            </div>
        </form>
        <iframe id="search-frame" title="Search results" src="about:blank"></iframe>
    </main>
    <script src="js/overlay-tab.js"></script>
    <script src="js/search-background.js"></script>
    <script src="js/search.js"></script>
</body>
</html>
