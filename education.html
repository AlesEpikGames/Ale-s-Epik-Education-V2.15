    <script>

        const currentDate = new Date();
        const dateElement = document.querySelector('.current-date');
        const dateFormatter = new Intl.DateTimeFormat('en-US', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        });
        dateElement.textContent = dateFormatter.format(currentDate);
        dateElement.dateTime = [
            currentDate.getFullYear(),
            String(currentDate.getMonth() + 1).padStart(2, '0'),
            String(currentDate.getDate()).padStart(2, '0')
        ].join('-');

        const searchInput = document.querySelector('#game-search');
        const sortButton = document.querySelector('#sort-games');
        const gameList = document.querySelector('#game-list');
        const gameButtons = document.querySelectorAll('.game-button');
        const noGamesMessage = document.querySelector('#no-games');
        const originalOrder = [...gameButtons];
        let isAlphabetical = false;

        function shuffleGames() {
            const shuffledButtons = [...gameButtons];
            for (let index = shuffledButtons.length - 1; index > 0; index--) {
                const randomIndex = Math.floor(Math.random() * (index + 1));
                [shuffledButtons[index], shuffledButtons[randomIndex]] = [shuffledButtons[randomIndex], shuffledButtons[index]];
            }
            shuffledButtons.forEach(gameButton => gameList.appendChild(gameButton));
        }

        function filterGames() {
            const searchText = searchInput.value.trim().toLowerCase();
            let visibleGames = 0;
            gameButtons.forEach(gameButton => {
                const title = gameButton.dataset.gameTitle.toLowerCase();
                const isVisible = !searchText || title.startsWith(searchText);
                gameButton.hidden = !isVisible;
                gameButton.style.display = isVisible ? 'flex' : 'none';
                if (isVisible) visibleGames++;
            });
            noGamesMessage.hidden = visibleGames > 0;
        }

        shuffleGames();
        searchInput.addEventListener('input', filterGames);
        sortButton.addEventListener('click', () => {
            if (isAlphabetical) {
                shuffleGames();
            } else {
                [...gameButtons]
                    .sort((firstGame, secondGame) => firstGame.dataset.gameTitle.localeCompare(secondGame.dataset.gameTitle))
                    .forEach(gameButton => gameList.appendChild(gameButton));
            }
            isAlphabetical = !isAlphabetical;
        });
    </script>
